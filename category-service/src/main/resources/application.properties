server.port=8084
spring.application.name=CATEGORY-SERVICE

# DB
spring.datasource.url=${SPRING_DATABASE_URL:jdbc:mysql://localhost:3306/inkwell_category?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATABASE_USERNAME:root}
spring.datasource.password=${SPRING_DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Debug (optional)
logging.level.org.springframework.security=DEBUG