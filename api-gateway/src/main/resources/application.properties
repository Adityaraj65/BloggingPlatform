server.port=8080
spring.application.name=API-GATEWAY

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# ================= ROUTES =================

# Auth Service (public) - includes OAuth2 endpoints
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**

# OAuth2 Authorization Endpoint
spring.cloud.gateway.routes[1].id=oauth2-auth
spring.cloud.gateway.routes[1].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/oauth2/**

# OAuth2 Callback Endpoint
spring.cloud.gateway.routes[2].id=oauth2-callback
spring.cloud.gateway.routes[2].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/login/oauth2/**

# Post Service
spring.cloud.gateway.routes[3].id=post-service
spring.cloud.gateway.routes[3].uri=lb://POST-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/posts/**
spring.cloud.gateway.routes[3].filters[0]=AuthenticationFilter

# Comment Service
spring.cloud.gateway.routes[4].id=comment-service
spring.cloud.gateway.routes[4].uri=lb://COMMENT-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/comments/**
spring.cloud.gateway.routes[4].filters[0]=AuthenticationFilter

# Category + Tags
spring.cloud.gateway.routes[5].id=category-service
spring.cloud.gateway.routes[5].uri=lb://CATEGORY-SERVICE
spring.cloud.gateway.routes[5].predicates[0]=Path=/categories/**,/tags/**
spring.cloud.gateway.routes[5].filters[0]=AuthenticationFilter

# Media Service
spring.cloud.gateway.routes[6].id=media-service
spring.cloud.gateway.routes[6].uri=lb://MEDIA-SERVICE
spring.cloud.gateway.routes[6].predicates[0]=Path=/media/**
spring.cloud.gateway.routes[6].filters[0]=AuthenticationFilter

# Newsletter (public)
spring.cloud.gateway.routes[7].id=newsletter-service
spring.cloud.gateway.routes[7].uri=lb://NEWSLETTER-SERVICE
spring.cloud.gateway.routes[7].predicates[0]=Path=/newsletter/**

# Notification Service
spring.cloud.gateway.routes[8].id=notification-service
spring.cloud.gateway.routes[8].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.routes[8].predicates[0]=Path=/notifications/**
spring.cloud.gateway.routes[8].filters[0]=AuthenticationFilter

# Health
management.endpoints.web.exposure.include=health,info