server.port=8087
spring.application.name=MEDIA-SERVICE

spring.datasource.url=${SPRING_DATABASE_URL:jdbc:mysql://localhost:3306/inkwell_media?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATABASE_USERNAME:root}
spring.datasource.password=${SPRING_DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Upload folder
file.upload-dir=uploads

# File size
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/